<!DOCTYPE html>
<html>
<head>
    <title>San Michele</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            overflow: hidden; /* Impedisce lo scrolling della pagina */
            height: 100vh;
            width: 100vw;
        }
        .fullscreen-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .slide-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .slide-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: opacity 0.3s ease;
        }
        .navigation {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }
        .navigation:hover {
            opacity: 1;
        }
        .nav-button {
            background-color: rgba(38, 76, 115, 0.7);
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 0 10px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        .nav-button:hover {
            background-color: rgba(38, 76, 115, 1);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .nav-button:disabled {
            background-color: rgba(156, 179, 201, 0.7);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .page-indicator {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            margin: 0 15px;
            min-width: 80px;
            text-align: center;
        }
        .slide-wrapper {
            transition: opacity 0.3s ease;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Cursori personalizzati per le aree cliccabili per cambiare diapositiva */
        .click-area-left, .click-area-right {
            position: absolute;
            top: 0;
            height: 100%;
            width: 20%;
            cursor: pointer;
            z-index: 90;
        }
        .click-area-left {
            left: 0;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>'), w-resize;
        }
        .click-area-right {
            right: 0;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>'), e-resize;
        }
    </style>
</head>
<body>
    <div class="fullscreen-container">
        <div id="slideContainer" class="slide-container">
            <!-- Le immagini verranno caricate qui tramite JavaScript -->
            <div class="click-area-left" id="clickAreaLeft"></div>
            <div class="click-area-right" id="clickAreaRight"></div>
        </div>
    </div>
    
    <div class="navigation">
        <button id="prevBtn" class="nav-button">◀ Precedente</button>
        <div id="pageIndicator" class="page-indicator">1 / 13</div>
        <button id="nextBtn" class="nav-button">Successiva ▶</button>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Configurazione
            const totalSlides = 13;
            const imageFolder = 'Images/'; // Modificato da 'images/' a 'Images/'
            const imagePrefix = '000';
            const imageExt = '.JPG';
            
            let currentSlide = 1;
            
            // Elementi DOM
            const slideContainer = document.getElementById('slideContainer');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const pageIndicator = document.getElementById('pageIndicator');
            const clickAreaLeft = document.getElementById('clickAreaLeft');
            const clickAreaRight = document.getElementById('clickAreaRight');
            
            // Funzione per formattare il numero della diapositiva
            function formatSlideNumber(num) {
                if (num < 10) {
                    return imagePrefix + num;
                } else {
                    // Per numeri a 2 cifre, rimuove il primo '0' da imagePrefix
                    return imagePrefix.slice(0, -1) + num;
                }
            }
            
            // Funzione per impostare la diapositiva corrente
            function setSlide(slideNumber) {
                // Validazione
                if (slideNumber < 1) {
                    slideNumber = 1;
                } else if (slideNumber > totalSlides) {
                    slideNumber = totalSlides;
                }
                
                // Aggiorna la variabile della diapositiva corrente
                currentSlide = slideNumber;
                
                // Aggiorna il contenitore della diapositiva
                const imagePath = imageFolder + formatSlideNumber(slideNumber) + imageExt;
                
                // Inizia la transizione - prima sfuma
                const oldSlideWrapper = document.getElementById('slideWrapper');
                if (oldSlideWrapper) {
                    oldSlideWrapper.style.opacity = '0';
                    
                    setTimeout(() => {
                        // Rimuovi le aree cliccabili dalla diapositiva precedente
                        if (clickAreaLeft.parentNode === oldSlideWrapper) {
                            slideContainer.appendChild(clickAreaLeft);
                        }
                        if (clickAreaRight.parentNode === oldSlideWrapper) {
                            slideContainer.appendChild(clickAreaRight);
                        }
                        
                        // Rimuovi la diapositiva precedente e crea la nuova
                        slideContainer.removeChild(oldSlideWrapper);
                        
                        const newSlideWrapper = document.createElement('div');
                        newSlideWrapper.id = 'slideWrapper';
                        newSlideWrapper.className = 'slide-wrapper';
                        newSlideWrapper.style.opacity = '0';
                        
                        const newSlideImage = document.createElement('img');
                        newSlideImage.src = imagePath;
                        newSlideImage.className = 'slide-image';
                        newSlideImage.alt = 'Diapositiva ' + slideNumber;
                        newSlideImage.id = 'slideImage';
                        
                        newSlideWrapper.appendChild(newSlideImage);
                        slideContainer.insertBefore(newSlideWrapper, clickAreaLeft);
                        
                        // Dopo un breve ritardo, mostra la nuova diapositiva
                        setTimeout(() => {
                            newSlideWrapper.style.opacity = '1';
                        }, 50);
                    }, 300);
                } else {
                    // Prima visualizzazione, nessuna transizione necessaria
                    const newSlideWrapper = document.createElement('div');
                    newSlideWrapper.id = 'slideWrapper';
                    newSlideWrapper.className = 'slide-wrapper';
                    
                    const newSlideImage = document.createElement('img');
                    newSlideImage.src = imagePath;
                    newSlideImage.className = 'slide-image';
                    newSlideImage.alt = 'Diapositiva ' + slideNumber;
                    newSlideImage.id = 'slideImage';
                    
                    newSlideWrapper.appendChild(newSlideImage);
                    slideContainer.insertBefore(newSlideWrapper, clickAreaLeft);
                }
                
                // Aggiorna l'indicatore di pagina
                pageIndicator.textContent = slideNumber + ' / ' + totalSlides;
                
                // Aggiorna lo stato dei pulsanti
                prevBtn.disabled = slideNumber <= 1;
                nextBtn.disabled = slideNumber >= totalSlides;
            }
            
            // Funzioni di navigazione
            function nextSlide() {
                if (currentSlide < totalSlides) {
                    setSlide(currentSlide + 1);
                }
            }
            
            function prevSlide() {
                if (currentSlide > 1) {
                    setSlide(currentSlide - 1);
                }
            }
            
            // Event listeners per i pulsanti
            prevBtn.addEventListener('click', prevSlide);
            nextBtn.addEventListener('click', nextSlide);
            
            // Event listeners per le aree cliccabili
            clickAreaLeft.addEventListener('click', prevSlide);
            clickAreaRight.addEventListener('click', nextSlide);
            
            // Event listener per tastiera
            document.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowLeft') {
                    prevSlide();
                } else if (e.key === 'ArrowRight') {
                    nextSlide();
                } else if (e.key === 'Escape') {
                    // Toggle visibilità dei controlli di navigazione
                    const navigation = document.querySelector('.navigation');
                    navigation.style.display = navigation.style.display === 'none' ? 'flex' : 'none';
                }
            });
            
            // Funzione per gestire il swipe su dispositivi touch
            let touchStartX = 0;
            let touchEndX = 0;
            
            document.addEventListener('touchstart', function(e) {
                touchStartX = e.changedTouches[0].screenX;
            }, false);
            
            document.addEventListener('touchend', function(e) {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, false);
            
            function handleSwipe() {
                const threshold = 100; // Minima distanza per considerare un swipe
                if (touchEndX < touchStartX - threshold) {
                    nextSlide(); // Swipe da destra a sinistra -> avanti
                } else if (touchEndX > touchStartX + threshold) {
                    prevSlide(); // Swipe da sinistra a destra -> indietro
                }
            }
            
            // Gestione errore caricamento immagine
            document.addEventListener('error', function(e) {
                if (e.target.tagName.toLowerCase() === 'img' && e.target.id === 'slideImage') {
                    console.error('Errore nel caricamento dell\'immagine:', e.target.src);
                    e.target.src = '';
                    e.target.alt = 'Immagine non trovata';
                    e.target.style.width = '80%';
                    e.target.style.height = '400px';
                    e.target.style.display = 'flex';
                    e.target.style.alignItems = 'center';
                    e.target.style.justifyContent = 'center';
                    e.target.style.border = '1px dashed #ccc';
                    e.target.style.backgroundColor = '#f9f9f9';
                    e.target.style.fontSize = '16px';
                    e.target.style.padding = '20px';
                    e.target.style.textAlign = 'center';
                    e.target.style.color = '#333';
                }
            }, true);
            
            // Mostra o nascondi la navigazione al movimento del mouse
            let timeout;
            document.addEventListener('mousemove', function() {
                const navigation = document.querySelector('.navigation');
                navigation.style.opacity = '1';
                
                clearTimeout(timeout);
                timeout = setTimeout(function() {
                    navigation.style.opacity = '0.5';
                }, 3000);
            });
            
            // Inizializza con la prima diapositiva
            setSlide(1);
        });
    </script>
</body>
</html>
